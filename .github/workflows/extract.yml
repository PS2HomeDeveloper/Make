name: Extract make-4.4.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          unzip -q make-4.4.1.zip -d .

      - name: Remove archive
        run: |
          rm -f make-4.4.1.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract make-4.4.1" || echo "No changes to commit"
          git push