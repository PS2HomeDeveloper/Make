name: Build GNU Make (Linux / Windows / macOS / Android / iOS)

# تشغيل يدوي فقط من تبويب Actions -> Run workflow
on:
  workflow_dispatch: {}

env:
  COMMON_CONFIGURE_FLAGS: --disable-nls --disable-rpath --without-guile
  LLVM_MINGW_VERSION: "20260616"

jobs:
  # ============================================================
  # لينكس: x86_64 / x86 (32-بت) عبر gcc، و arm64 عبر ترجمة متقاطعة
  # ============================================================
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: "gcc -m64"
            cflags: "-m64 -O2"
            ldflags: "-m64"
            host: ""
            apt_pkg: ""
            out_name: make_linux_x86_64
          - arch: x86
            cc: "gcc -m32"
            cflags: "-m32 -O2"
            ldflags: "-m32"
            host: ""
            apt_pkg: "gcc-multilib g++-multilib libc6-dev-i386"
            out_name: make_linux_x86
          - arch: arm64
            cc: "aarch64-linux-gnu-gcc"
            cflags: "-O2"
            ldflags: ""
            host: "aarch64-linux-gnu"
            apt_pkg: "gcc-aarch64-linux-gnu"
            out_name: make_linux_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ -n "${{ matrix.apt_pkg }}" ]; then
            sudo apt-get install -y ${{ matrix.apt_pkg }}
          fi

      - name: Configure
        run: |
          chmod +x ./configure ./build-aux/*
          HOST_FLAG=""
          if [ -n "${{ matrix.host }}" ]; then
            HOST_FLAG="--host=${{ matrix.host }}"
          fi
          ./configure \
            $HOST_FLAG \
            $COMMON_CONFIGURE_FLAGS \
            CC="${{ matrix.cc }}" \
            CFLAGS="${{ matrix.cflags }}" \
            LDFLAGS="${{ matrix.ldflags }}"

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify binary architecture
        run: |
          file ./make
          if [ "${{ matrix.arch }}" != "arm64" ]; then
            ./make --version
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp ./make "dist/${{ matrix.out_name }}"
          chmod +x "dist/${{ matrix.out_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # ويندوز: x86_64/x86 عبر mingw-w64 (gcc)، وarm64 عبر llvm-mingw (clang)
  # ============================================================
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host: x86_64-w64-mingw32
            toolchain: mingw-gcc
            cc: x86_64-w64-mingw32-gcc
            out_name: make_windows_x86_64.exe
          - arch: x86
            host: i686-w64-mingw32
            toolchain: mingw-gcc
            cc: i686-w64-mingw32-gcc
            out_name: make_windows_x86.exe
          - arch: arm64
            host: aarch64-w64-mingw32
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            out_name: make_windows_arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64 (gcc) toolchain
        if: matrix.toolchain == 'mingw-gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Install llvm-mingw toolchain (for arm64)
        if: matrix.toolchain == 'llvm-mingw'
        run: |
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -L -o llvm-mingw.tar.xz "$URL"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Configure (cross-compile for Windows)
        run: |
          chmod +x ./configure ./build-aux/*
          command -v "${{ matrix.cc }}"
          "${{ matrix.cc }}" --version
          ./configure \
            --host=${{ matrix.host }} \
            $COMMON_CONFIGURE_FLAGS \
            CC="${{ matrix.cc }}" \
            CFLAGS="-O2"

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify output
        run: |
          ls -la make.exe
          file make.exe

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp ./make.exe "dist/${{ matrix.out_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # أندرويد: arm64-v8a / armeabi-v7a / x86_64 / x86 عبر Android NDK
  # ============================================================
  android:
    name: android-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            host: aarch64-linux-android
            clang_triplet: aarch64-linux-android21-clang
            out_name: make_android_arm64-v8a
          - arch: armeabi-v7a
            host: arm-linux-androideabi
            clang_triplet: armv7a-linux-androideabi21-clang
            out_name: make_android_armeabi-v7a
          - arch: x86_64
            host: x86_64-linux-android
            clang_triplet: x86_64-linux-android21-clang
            out_name: make_android_x86_64
          - arch: x86
            host: i686-linux-android
            clang_triplet: i686-linux-android21-clang
            out_name: make_android_x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Configure (cross-compile for Android)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "--- محتويات مجلد الأدوات (للتشخيص) ---"
          ls -la "$TOOLCHAIN/bin" | grep -i "clang\|llvm-ar\|llvm-ranlib\|llvm-strip" || true

          export CC="$TOOLCHAIN/bin/${{ matrix.clang_triplet }}"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          if [ ! -x "$TOOLCHAIN/bin/clang" ]; then
            echo "::error::clang غير موجود في $TOOLCHAIN/bin -- تثبيت NDK غير مكتمل"
            exit 1
          fi

          "$CC" --version
          chmod +x ./configure ./build-aux/*
          ./configure \
            --host=${{ matrix.host }} \
            $COMMON_CONFIGURE_FLAGS \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            CFLAGS="-O2"

      - name: Build
        run: make -j"$(nproc)"

      - name: Strip & verify
        run: |
          "$TOOLCHAIN/bin/llvm-strip" ./make
          file ./make

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp ./make "dist/${{ matrix.out_name }}"
          chmod +x "dist/${{ matrix.out_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # macOS: arm64 (Apple Silicon) و x86_64 (Intel)
  # ============================================================
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cc: "clang -arch arm64"
            host: ""
            out_name: make_macos_arm64
            can_run: true
          - arch: x86_64
            cc: "clang -arch x86_64"
            host: "x86_64-apple-darwin"
            out_name: make_macos_x86_64
            can_run: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          chmod +x ./configure ./build-aux/*
          HOST_FLAG=""
          if [ -n "${{ matrix.host }}" ]; then
            HOST_FLAG="--host=${{ matrix.host }}"
          fi
          ./configure \
            $HOST_FLAG \
            $COMMON_CONFIGURE_FLAGS \
            CC="${{ matrix.cc }}" \
            CFLAGS="-O2"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify binary architecture
        run: |
          file ./make
          if [ "${{ matrix.can_run }}" = "true" ]; then
            ./make --version
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp ./make "dist/${{ matrix.out_name }}"
          chmod +x "dist/${{ matrix.out_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # iOS: arm64 (الأجهزة الحقيقية) و x86_64 (محاكي iOS Simulator على Mac Intel)
  # ملاحظة: هذا بناء متقاطع فقط. تطبيقات المتجر لا يُسمح لها بتشغيل
  # ثنائي منفصل وقت التشغيل بسبب صرامة sandbox الخاص بـ iOS.
  # ============================================================
  ios:
    name: ios-${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            sdk: iphoneos
            version_min_flag: "-miphoneos-version-min=14.0"
            out_name: make_ios_arm64
          - arch: x86_64
            sdk: iphonesimulator
            version_min_flag: "-mios-simulator-version-min=14.0"
            out_name: make_ios_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (cross-compile for iOS)
        run: |
          chmod +x ./configure ./build-aux/*
          IOS_SDK="$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)"
          IOS_AR="$(xcrun --sdk ${{ matrix.sdk }} -f ar)"
          IOS_RANLIB="$(xcrun --sdk ${{ matrix.sdk }} -f ranlib)"
          CC="clang -arch ${{ matrix.arch }} -isysroot $IOS_SDK ${{ matrix.version_min_flag }} -D__BEOS__=1"
          echo "CC value: $CC"
          ./configure \
            --host=${{ matrix.arch }}-apple-ios \
            $COMMON_CONFIGURE_FLAGS \
            CC="$CC" AR="$IOS_AR" RANLIB="$IOS_RANLIB" \
            CFLAGS="-O2"

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify binary architecture
        run: file ./make

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp ./make "dist/${{ matrix.out_name }}"
          chmod +x "dist/${{ matrix.out_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: dist/${{ matrix.out_name }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
